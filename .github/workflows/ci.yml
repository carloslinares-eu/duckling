name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux (GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build libudev-dev pkg-config
      - name: Configure
        run: cmake --preset linux-release
      - name: Build
        run: cmake --build --preset linux-release
      - name: Test
        run: ctest --preset linux-release
      - name: Smoke run
        run: |
          ./build/linux-release/duckling version
          ldd ./build/linux-release/duckling
      - uses: actions/upload-artifact@v7
        with:
          name: duckling-linux-x86_64
          path: build/linux-release/duckling
          if-no-files-found: error

  windows-mingw-build:
    name: Windows (MinGW cross-build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build mingw-w64
      - name: Configure
        run: cmake --preset windows-mingw-release
      - name: Build
        run: cmake --build --preset windows-mingw-release
      - name: Check DLL imports (system DLLs only)
        run: |
          x86_64-w64-mingw32-objdump -p build/windows-mingw-release/duckling.exe | grep "DLL Name" | tee imports.txt
          if grep -viE "KERNEL32|msvcrt|api-ms-win" imports.txt; then
            echo "::error::duckling.exe depends on non-system DLLs"; exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: duckling-windows-x86_64-mingw
          path: |
            build/windows-mingw-release/duckling.exe
            build/windows-mingw-release/tests/duckling_tests.exe
          if-no-files-found: error

  windows-mingw-test:
    name: Windows (run MinGW build)
    needs: windows-mingw-build
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: duckling-windows-x86_64-mingw
      - name: Run
        shell: pwsh
        run: |
          Get-ChildItem -Recurse
          .\duckling.exe version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\tests\duckling_tests.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

  windows-msvc:
    name: Windows (MSVC)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake --preset windows-msvc-release
      - name: Build
        run: cmake --build --preset windows-msvc-release
      - name: Test
        run: ctest --preset windows-msvc-release
      - name: Smoke run
        run: .\build\windows-msvc-release\duckling.exe version

  docs:
    name: Doxygen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends doxygen
      - name: Generate
        run: |
          mkdir -p build
          ( cat Doxyfile; echo "WARN_LOGFILE = build/doxygen-warnings.txt" ) | doxygen -
      - name: Report warnings
        run: |
          n=$(grep -c . build/doxygen-warnings.txt || true)
          {
            echo "### Doxygen: ${n} warning(s)"
            if [ "$n" -gt 0 ]; then echo '```'; head -100 build/doxygen-warnings.txt; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -gt 0 ]; then echo "::warning::Doxygen reported ${n} warning(s), see the job summary"; fi
      - uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: build/docs/html
          if-no-files-found: error
